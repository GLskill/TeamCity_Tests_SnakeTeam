name: Run TeamCity Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: false
        type: choice
        options:
          - all
          - api
          - ui
        default: all
      markers:
        description: "Additional pytest markers"
        required: false
        default: ""

env:
  COMPOSE_FILE: infra/docker_compose/docker-compose.yml
  UI_BASE_URL: http://localhost:8111
  baseurl: http://localhost:8111/app/rest/

jobs:
  run-tests:
    name: Run TeamCity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 1. Python + зависимости
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium firefox

      # 2. Поднимаем окружение (Server + Agent + Setup)
      - name: Start environment
        run: docker compose -f $COMPOSE_FILE up -d --wait webapp agent setup
        timeout-minutes: 15

      # 3. Запускаем тесты
      - name: Run tests
        env:
          ENV_FILE: .env
          PYTHONPATH: .
        run: |
          SUITE="${{ inputs.suite }}"
          MARKERS="${{ inputs.markers }}"
          OPTS=""
          [ -n "$MARKERS" ] && OPTS="-m $MARKERS"

          if   [ "$SUITE" = "api" ]; then pytest tests/ -m api $OPTS -v
          elif [ "$SUITE" = "ui"  ]; then pytest tests/ -m ui  $OPTS -v
          else                            pytest tests/        $OPTS -v
          fi

      # 4. Очищаем окружение
      - name: Stop environment
        if: always()
        run: docker compose -f $COMPOSE_FILE down -v

      # 5. Allure отчёт → GitHub Pages
      - name: Load Allure history
        uses: actions/checkout@v5
        if: always()
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

name: Run TeamCity Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: false
        type: choice
        options:
          - all
          - api
          - ui
        default: all
      markers:
        description: "Additional pytest markers"
        required: false
        default: ""

env:
  COMPOSE_FILE: infra/docker_compose/docker-compose.yml
  UI_BASE_URL: http://localhost:8111
  baseurl: http://localhost:8111/app/rest/

jobs:
  run-tests:
    name: Run TeamCity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 1. Python + зависимости
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium firefox

      # 2. Запускаем сервер и агента
      - name: Start TeamCity Server and Agent
        run: docker compose -f $COMPOSE_FILE up -d webapp agent

      # 3. Ждём пока TeamCity Server полностью поднимется
      - name: Wait for TeamCity Server
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8111/mnt -o /dev/null; then
              echo "TeamCity is ready!"; break
            fi
            echo "Waiting... ($i/60)"; sleep 5
          done
          curl -sf http://localhost:8111/mnt -o /dev/null || (echo "TeamCity not ready!" && exit 1)

      # 4. Запускаем setup (блокирует пока не завершится)
      - name: Run Setup
        run: docker compose -f $COMPOSE_FILE up setup
        timeout-minutes: 10

      # 5. Ждём авторизации агента
      - name: Wait for Agent
        run: |
          for i in {1..24}; do
            if docker inspect --format='{{.State.Health.Status}}' teamcity-agent-instance 2>/dev/null | grep -q healthy; then
              echo "Agent is ready!"; break
            fi
            sleep 5
          done

      # 3. Запускаем тесты
      - name: Run tests
        env:
          ENV_FILE: .env
          PYTHONPATH: .
        run: |
          SUITE="${{ inputs.suite }}"
          MARKERS="${{ inputs.markers }}"
          OPTS=""
          [ -n "$MARKERS" ] && OPTS="-m $MARKERS"

          if   [ "$SUITE" = "api" ]; then pytest tests/ -m api $OPTS -v
          elif [ "$SUITE" = "ui"  ]; then pytest tests/ -m ui  $OPTS -v
          else                            pytest tests/        $OPTS -v
          fi

      # 4. Очищаем окружение
      - name: Stop environment
        if: always()
        run: docker compose -f $COMPOSE_FILE down -v

      # 5. Allure отчёт → GitHub Pages
      - name: Load Allure history
        uses: actions/checkout@v5
        if: always()
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

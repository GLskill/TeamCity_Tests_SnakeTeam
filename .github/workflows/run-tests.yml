name: Run TeamCity Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-tests:
    name: Start TeamCity + Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start environment and run tests
        run: |
          docker compose -f infra/docker_compose/docker-compose.yml up -d --wait
        timeout-minutes: 50

      - name: Show test logs
        if: always()
        run: |
          docker compose -f infra/docker_compose/docker-compose.yml logs tests

      - name: Check test result
        run: |
          EXIT_CODE=$(docker inspect teamcity-tests --format='{{.State.ExitCode}}')
          echo "pytest exit code: $EXIT_CODE"

          # Парсим результаты из логов и пишем в Summary
          LOGS=$(docker compose -f infra/docker_compose/docker-compose.yml logs tests 2>/dev/null)
          SUMMARY=$(echo "$LOGS" | grep -E "passed|failed|error" | tail -1 | sed 's/.*| //')

          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "### ✅ $SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ $SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Allure report available in **Artifacts** section below" >> $GITHUB_STEP_SUMMARY

          exit "$EXIT_CODE"

      - name: Publish test results
        uses: EnricoMi/publish-test-results-action@v2
        if: always()
        with:
          files: test-results/results.xml

      - name: Load Allure history
        uses: actions/checkout@v5
        if: always()
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-history
          retention-days: 30

      - name: Stop environment
        if: always()
        run: |
          docker compose -f infra/docker_compose/docker-compose.yml down -v

# ── Tests Job ─────────────────────────────────────────────────────
# Аналог сервиса tests в docker-compose.
# Запускается после setup-job через initContainer который ждёт
# завершения setup (в K8s нет depends_on как в compose).
apiVersion: batch/v1
kind: Job
metadata:
  name: teamcity-tests
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        # Ждём пока setup-job завершится успешно.
        # Проверяем появление .env файла — признак успешного setup.
        - name: wait-for-setup
          image: {{ .Values.tests.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "[init] Ждём завершения setup..."
              until [ -f /app/.env ]; do
                echo "[init] .env ещё не создан, ждём 5 сек..."
                sleep 5
              done
              echo "[init] Setup завершён!"
        # Ждём пока агент станет healthy (авторизован).
        - name: wait-for-agent
          image: curlimages/curl:latest
          env:
            - name: ENV_FILE
              value: /app/.env
          command:
            - sh
            - -c
            - |
              echo "[init] Ждём готовности агента..."
              until curl -sf "http://teamcity-server:{{ .Values.webapp.port }}/app/rest/agents?locator=authorized:true" \
                -H "Accept: application/json" | grep -q '"count":[^0]'; do
                echo "[init] Агент ещё не авторизован, ждём 5 сек..."
                sleep 5
              done
              echo "[init] Агент готов!"
      containers:
        - name: tests
          image: {{ .Values.tests.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: UI_BASE_URL
              value: "http://teamcity-server:{{ .Values.webapp.port }}"
            - name: baseurl
              value: "http://teamcity-server:{{ .Values.webapp.port }}/app/rest/"
            - name: ENV_FILE
              value: /app/.env
            - name: PYTHONPATH
              value: /app
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_COLOR
              value: "1"
            - name: TERM
              value: xterm-256color
          command:
            - sh
            - -c
            - |
              echo '[tests] Запускаем pytest...'
              xvfb-run -a pytest -v --color=yes
              EXIT_CODE=$?
              echo '[tests] pytest завершён'
              exit $EXIT_CODE
          workingDir: /app

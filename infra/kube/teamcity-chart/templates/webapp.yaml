
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teamcity-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.webapp.storage.data }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teamcity-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.webapp.storage.logs }}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamcity-server
  labels:
    app: teamcity-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teamcity-server
  template:
    metadata:
      labels:
        app: teamcity-server
    spec:
      containers:
        - name: teamcity-server
          image: {{ .Values.webapp.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.webapp.port }}
          readinessProbe:
            httpGet:
              path: /mnt
              port: {{ .Values.webapp.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /mnt
              port: {{ .Values.webapp.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: teamcity-data
              mountPath: /data/teamcity_server/datadir
            - name: teamcity-logs
              mountPath: /opt/teamcity/logs
      volumes:
        - name: teamcity-data
          persistentVolumeClaim:
            claimName: teamcity-data
        - name: teamcity-logs
          persistentVolumeClaim:
            claimName: teamcity-logs
---

apiVersion: v1
kind: Service
metadata:
  name: teamcity-server
  labels:
    app: teamcity-server
spec:
  selector:
    app: teamcity-server
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.webapp.port }}
      targetPort: {{ .Values.webapp.port }}
  type: ClusterIP
